<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 590" width="1000" height="590" role="img" aria-labelledby="t d">
<title id="t">pam-device-auth: the three security layers</title>
<desc id="d">A non-root SSH login passes three layers inside the SSH host. Layer 1: sshd accepts only a public key that SSSD fetches from the directory. Layer 2: pam-device-auth runs the OIDC sign-in with the identity provider, a device flow or a cached refresh, and validates the token and role locally. Layer 3: the PAM account phase checks the per-user source-IP allowlist and the group membership. Service accounts use only their directory key and skip layer 2. Root uses only its local SSH key. A failure in any layer ends the login.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9z" fill="#656c76"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9z" fill="#4493f8"/></marker>
</defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Helvetica,Arial,sans-serif;font-size:12.5px;fill:#9198a1}
.h{font-size:14px;font-weight:600;fill:#f0f6fc}
.p{font-size:15px;font-weight:600;fill:#4493f8}
.c{text-anchor:middle}
.r{text-anchor:end}
.n{font-style:italic}
.e{font-size:12px}
.box{fill:#151b23;stroke:#3d444d;stroke-width:1}
.in{fill:#0d1117;stroke:#1f6feb;stroke-width:1}
.l{fill:none;stroke:#656c76;stroke-width:1.25;marker-end:url(#a)}
.k{fill:none;stroke:#4493f8;stroke-width:1.25;stroke-dasharray:5 4;marker-end:url(#b)}
</style>
<rect class="box" x="480" y="20" width="160" height="56" rx="8"/>
<text class="h c" x="560" y="44">Identity provider</text>
<text class="c" x="560" y="62">e.g. Keycloak</text>
<rect class="box" x="716" y="20" width="140" height="56" rx="8"/>
<text class="h c" x="786" y="44">User's browser</text>
<text class="c" x="786" y="64">approves the code</text>
<path class="k" d="M714 48H642"/>
<text class="e c" x="678" y="40">sign in</text>
<rect class="box" x="16" y="174" width="110" height="88" rx="8"/>
<text class="h c" x="71" y="200">SSH client</text>
<text class="c" x="71" y="220">ssh user@host</text>
<text class="c" x="71" y="236">with SSH key</text>
<path class="l" d="M126 218H280"/>
<text class="e c" x="158" y="206">SSH</text>
<text class="e c" x="152" y="238">key + OIDC</text>
<rect x="190" y="110" width="660" height="360" rx="14" fill="#121d2f" stroke="#4493f8" stroke-width="1.5"/>
<text class="p" x="208" y="136">SSH host: sshd + pam-device-auth</text>
<rect class="in" x="282" y="170" width="150" height="96" rx="8"/>
<text class="h c" x="357" y="196">1 · SSH key</text>
<text class="c" x="357" y="216">public key from the</text>
<text class="c" x="357" y="232">directory, local keys</text>
<text class="c" x="357" y="248">are ignored</text>
<rect class="in" x="470" y="170" width="180" height="96" rx="8"/>
<text class="h c" x="560" y="196">2 · OIDC sign-in</text>
<text class="c" x="560" y="216">device flow or cached</text>
<text class="c" x="560" y="232">refresh, then validate</text>
<text class="c" x="560" y="248">the token and role</text>
<rect class="in" x="684" y="170" width="156" height="96" rx="8"/>
<text class="h c" x="762" y="196">3 · Account phase</text>
<text class="c" x="762" y="216">source IP in clients</text>
<text class="c" x="762" y="232">allowlist, group</text>
<text class="c" x="762" y="248">membership (pam_sss)</text>
<path class="l" d="M432 218H468"/>
<path class="l" d="M650 218H682"/>
<path class="l" d="M840 218H870"/>
<rect class="box" x="872" y="174" width="118" height="88" rx="8"/>
<text class="h c" x="931" y="200">Session</text>
<text class="c" x="931" y="220">home directory,</text>
<text class="c" x="931" y="236">shell opens</text>
<circle cx="451" cy="218" r="3" fill="#656c76"/>
<path class="l" d="M451 218V314H720V268"/>
<text class="n e" x="462" y="306">service accounts: key only, no OIDC</text>
<rect class="box" x="206" y="350" width="116" height="70" rx="8"/>
<text class="h c" x="264" y="374">Root</text>
<text class="c" x="264" y="394">local key only,</text>
<text class="c" x="264" y="410">no LDAP or OIDC</text>
<text class="c n" x="520" y="452">A failure in any layer ends the login.</text>
<path class="k" d="M560 76V168"/>
<text class="e" x="572" y="96">device flow + JWKS over HTTPS</text>
<rect class="box" x="282" y="510" width="550" height="60" rx="8"/>
<text class="h c" x="557" y="536">Directory (LLDAP via SSSD)</text>
<text class="c" x="557" y="556">SSH keys, groups, clients allowlist, sudo password</text>
<path class="k" d="M357 510V268"/>
<text class="e" x="367" y="492">keys, groups over LDAPS</text>
<path class="k" d="M800 510V268"/>
<text class="e r" x="790" y="492">groups, clients</text>
</svg>
