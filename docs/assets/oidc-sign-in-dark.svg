<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" role="img" aria-labelledby="t d">
<title id="t">pam-device-auth: layer 2, the OIDC sign-in</title>
<desc id="d">After the SSH key is accepted, pam-device-auth first checks that the user resolves through SSSD. With a cached session for the same source IP it refreshes the token at the identity provider; otherwise it runs the device flow, where the user approves a code in the browser. A rejected refresh clears the cache, a network error keeps it. The token is validated locally against the cached JWKS: signature, issuer, azp or aud, exp, nbf, iat, kid, the username and the required role. Layer 3 follows.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9z" fill="#656c76"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9z" fill="#4493f8"/></marker>
</defs>
<style>
