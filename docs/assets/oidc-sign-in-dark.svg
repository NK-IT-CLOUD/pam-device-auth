<text class="h c" x="71" y="226">SSH client</text>
<text class="c" x="71" y="246">key accepted,</text>
<text class="c" x="71" y="262">OIDC prompt</text>
<path class="l" d="M126 244H168"/>
<rect x="170" y="100" width="700" height="300" rx="14" fill="#121d2f" stroke="#4493f8" stroke-width="1.5"/>
<text class="p" x="188" y="126">Layer 2: pam_device_auth</text>
<rect class="in" x="206" y="208" width="120" height="72" rx="8"/>
<text class="h c" x="266" y="234">Identity gate</text>
<text class="c" x="266" y="254">user resolves via</text>
<text class="c" x="266" y="270">SSSD, else deny</text>
<path class="l" d="M326 244H348"/>
<path d="M372 222L394 244L372 266L350 244z" fill="#4493f8"/>
<text class="h" x="404" y="240">Cached session</text>
<text class="e" x="404" y="257">for this source IP?</text>
<path class="l" d="M372 222V176H430"/>
<path class="l" d="M372 266V332H430"/>
<text class="e" x="382" y="207">yes</text>
<text class="e" x="382" y="296">no</text>
<rect class="in" x="432" y="140" width="170" height="72" rx="8"/>
<text class="h c" x="517" y="166">Refresh token</text>
<text class="c" x="517" y="186">at the token endpoint</text>
<text class="c" x="517" y="202">known IP only</text>
<rect class="in" x="432" y="296" width="170" height="72" rx="8"/>
<text class="h c" x="517" y="322">Device flow</text>
<text class="c" x="517" y="342">URL, code and QR code,</text>
<text class="c" x="517" y="358">poll until approved</text>
<rect class="in" x="652" y="150" width="198" height="196" rx="8"/>
<text class="h c" x="751" y="222">Validate token</text>
<text class="c" x="751" y="242">signature via cached JWKS</text>
<text class="c" x="751" y="258">iss, azp/aud, exp/nbf/iat</text>
<text class="c" x="751" y="274">kid, username = SSH user</text>
<text class="c" x="751" y="290">required role present</text>
<path class="l" d="M602 176H650"/>
<path class="l" d="M602 332H650"/>
<path class="l" d="M850 248H898"/>
<rect class="box" x="900" y="204" width="90" height="88" rx="8"/>
<text class="h c" x="945" y="230">Layer 3</text>
<text class="c" x="945" y="250">account</text>
<text class="c" x="945" y="266">phase</text>
<text class="n e" x="206" y="324">Refresh rejected:</text>
<text class="n e" x="206" y="340">cache cleared.</text>
<text class="n e" x="206" y="360">Network error:</text>
