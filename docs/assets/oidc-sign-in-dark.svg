<rect class="box" x="452" y="430" width="130" height="56" rx="8"/>
<text class="h c" x="517" y="454">User's browser</text>
<text class="c" x="517" y="474">approves the code</text>
<path class="k" d="M517 368V428"/>
<text class="e" x="527" y="420">opens the link</text>
</svg>
