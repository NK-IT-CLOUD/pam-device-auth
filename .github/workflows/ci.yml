# CI for pushes and pull requests. The same file runs on GitHub (hosted runners, no
# secrets) and on the maintainer's own runner (repository variable CI_RUNNER selects
# it there). The own runner only takes pushes and pull requests from this repository;
# pull requests from forks always run on a hosted runner, so code from outside never
# reaches it. Release candidates are additionally tested on real hosts (integration
# tests) before a release.
name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded pull-request runs are cancelled; every push to main runs to the end.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ${{ (vars.CI_RUNNER != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # go.mod pins the toolchain (security-patched stdlib); setup-go honours it.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # The self-hosted runner has the build dependencies installed.
      - name: Build dependencies
        if: ${{ !(vars.CI_RUNNER != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) }}
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gcc libpam0g-dev

      - name: Format
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "Unformatted Go files:"
            echo "$UNFORMATTED"
            gofmt -d .
            exit 1
          fi

      - name: Version consistency
        run: |
          V_FILE=$(tr -d '[:space:]' < VERSION)
          V_MAKE=$(grep '^VERSION' makefile | sed 's/.*=\s*//' | tr -d '[:space:]')
          V_MAIN=$(grep -E '^var VERSION = "' cmd/pam-device-auth/main.go | grep -o '"[^"]*"' | tr -d '"')
          V_DEB=$(grep '^Version:' debian/control | cut -d' ' -f2 | tr -d '[:space:]' | sed 's/~rc/-rc/')
          # .TH NAME SECTION "date" "version" "manual": the version is the 4th field
          V_MAN=$(grep -m1 '^\.TH ' man/pam-device-auth.8 | awk -F'"' '{print $4}')
          for v in "$V_MAKE" "$V_MAIN" "$V_DEB" "$V_MAN"; do
            if [ "$v" != "$V_FILE" ]; then
              echo "Version mismatch: VERSION=$V_FILE makefile=$V_MAKE main.go=$V_MAIN debian/control=$V_DEB man=$V_MAN"
              exit 1
            fi
          done
          echo "Version check OK: $V_FILE"

      - name: Verify dependencies
        run: go mod verify

      # Every relative link and image in the public documentation must resolve in
      # this tree, including heading anchors (GitHub slug rules).
      - name: Documentation links
        run: |
          python3 - <<'PY'
          import glob, os, re, sys
          files = ["README.md", "INSTALL.md", "CONTRIBUTING.md", "SECURITY.md", "CHANGELOG.md"] + sorted(glob.glob("docs/*.md"))
          def slugs(path):
              out = set()
              for line in open(path, encoding="utf-8"):
                  m = re.match(r"^#{1,6}\s+(.*?)\s*#*\s*$", line)
                  if m:
                      t = re.sub(r"[`*]", "", m.group(1)).lower()
                      t = re.sub(r"[^\w\- ]", "", t).replace(" ", "-")
                      out.add(t)
              return out
          bad = []
          for f in files:
              text = open(f, encoding="utf-8").read()
              text = re.sub(r"```.*?```", "", text, flags=re.S)
              refs = re.findall(r"\]\(([^)\s]+)\)", text) + re.findall(r'(?:src|srcset)="([^"]+)"', text)
              for ref in refs:
                  if re.match(r"^(https?:|mailto:)", ref):
                      continue
                  path, _, frag = ref.partition("#")
                  target = os.path.normpath(os.path.join(os.path.dirname(f), path)) if path else f
                  if not os.path.exists(target):
                      bad.append(f"{f}: {ref} (missing {target})")
                  elif frag and target.endswith(".md") and frag not in slugs(target):
                      bad.append(f"{f}: {ref} (no heading #{frag} in {target})")
          if bad:
              print("Broken documentation links:")
              print("\n".join(bad))
              sys.exit(1)
          print(f"Documentation links OK ({len(files)} files)")
          PY

      - name: Build
        run: |
          make build
          make pam

      - name: Test
        run: make test

      - name: Vet
        run: make lint

      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  # Self-test of the leak gate; then, where the patterns exist (secrets), nothing
  # private in the tree.
  leak-gate:
    runs-on: ${{ (vars.CI_RUNNER != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && vars.CI_RUNNER || 'ubuntu-latest' }}
    if: vars.CI_RUNNER == '' || github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Self-test
        run: packaging/leak-gate-test.sh

      # The own runner must never take a pull request from a fork: every runs-on that
      # can select it carries the same-repository condition.
      - name: Runner guard
        run: |
          set -euo pipefail
          bad=$(grep -nE '^[[:space:]]*runs-on:.*CI_RUNNER' .github/workflows/*.yml | grep -v 'github.event.pull_request.head.repo.full_name == github.repository' || true)
          [ -z "$bad" ] || { echo "runs-on selects CI_RUNNER without the fork guard:"; echo "$bad"; exit 1; }
          echo "runner guard OK: $(grep -hE '^[[:space:]]*runs-on:.*CI_RUNNER' .github/workflows/*.yml | wc -l) runs-on line(s)"

      - name: Tree
        env:
          LEAK_PATTERNS: ${{ secrets.LEAK_PATTERNS }}
          LEAK_ALLOW: ${{ secrets.LEAK_ALLOW }}
          SELF_HOSTED: ${{ (vars.CI_RUNNER != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && vars.CI_RUNNER || '' }}
        run: |
          set -euo pipefail
          if [ -z "$LEAK_PATTERNS" ]; then
            # The maintainer's CI must scan; elsewhere there are no patterns.
            [ -z "$SELF_HOSTED" ] || { echo "FAIL: secret LEAK_PATTERNS missing"; exit 1; }
            echo "no leak patterns here: self-test only"; exit 0
          fi
          packaging/leak-gate.sh HEAD
