# pam-device-auth — SSH daemon configuration (directory mode)
# Reference copy shipped in /usr/share/pam-device-auth/config/; the package does
# not install it. `pam-device-auth --setup-ldap` and `--enable` render the
# effective /etc/ssh/sshd_config.d/10-pam-device-auth.conf from the resolved
# sss_ssh_authorizedkeys path and validate it with `sshd -t`.

KbdInteractiveAuthentication yes
PermitRootLogin prohibit-password
UsePAM yes
PasswordAuthentication no
# 3 leaves room for: agent key offers that get rejected before the
# keyboard-interactive/OIDC path is reached, plus one mistyped local password.
MaxAuthTries 3
# DEBUG1 is REQUIRED, not a leftover: internal/sshclient reads the
# "remote software version" line from sshd's journal to auto-detect the
# client and suppress the Unicode QR for terminals that mangle it
# (Win32-OpenSSH/Termux). sshd logs that line only at DEBUG level; VERBOSE
# is not enough. Operators who don't want DEBUG verbosity can instead set
# "show_qr": false in config.json and lower this to INFO.
LogLevel DEBUG1
# Non-root: SSH key (from the directory via SSSD) AND OIDC (keyboard-interactive/PAM) — 2FA.
# AuthorizedKeysFile none: local ~/.ssh/authorized_keys must NOT work for
# non-root, otherwise a same-named local account bypasses directory revocation.
AuthenticationMethods publickey,keyboard-interactive:pam
AuthorizedKeysFile none
AuthorizedKeysCommand /usr/bin/sss_ssh_authorizedkeys
AuthorizedKeysCommandUser nobody

# Root: SSH key only (break-glass; never OIDC/SSSD)
Match User root
    AuthenticationMethods publickey
    AuthorizedKeysFile .ssh/authorized_keys
